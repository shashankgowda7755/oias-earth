<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>OIAS Earth</title>
  <!-- Outer orbit ring — nearly closed, tapers to leaf-tip point at apex -->
  <path d="M16 3.5 C9.6 3.5, 3.5 9.1, 3.5 16 C3.5 22.9, 9.1 28.5, 16 28.5 C22.9 28.5, 28.5 22.9, 28.5 16 C28.5 9.1, 22.9 3.5, 16 3.5 Z" stroke="#b6ff3c" stroke-width="2" fill="none"/>
  <!-- Inner growth arc — partial, creates measurement-ring feel -->
  <path d="M22.5 10 C20.5 7.5, 16 7, 13 8.5 C9 10.5, 8 15, 9 18.5 C10 22, 13.5 24, 16 24" stroke="#b6ff3c" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.5"/>
  <!-- Proof node — center dot -->
  <circle cx="16" cy="16" r="2.8" fill="#b6ff3c"/>
  <!-- Crosshair tick marks — signal "measured" -->
  <line x1="16" y1="3.5" x2="16" y2="7" stroke="#b6ff3c" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="25" x2="16" y2="28.5" stroke="#b6ff3c" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
</svg>
